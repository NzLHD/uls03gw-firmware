name: tests

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install compilers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc make libc6-dev gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Unit tests (ASan/UBSan)
        working-directory: firmware/tests
        run: make -s clean && make -s test
      - name: ARM968 compile check (-Werror)
        working-directory: firmware/tests
        run: make -s cross ARM_CC=arm-none-eabi-gcc ARM_SIZE=arm-none-eabi-size
